# What this app is called and where it lives — the per-repo half of the pipeline.
#
# Both routes read it: .github/workflows/ios-release.yml on a v* tag, and
# scripts/release-ios.sh on the maintainer's Mac. So the two cannot disagree about which
# scheme to build or which .ipa to upload.
#
# Shell syntax, no quotes: the workflow appends these lines to $GITHUB_ENV.
IOS_DIR=ios                          # the iPhone/Watch project; the Mac app is SwiftPM
GENERATE=./generate.sh               # not plain xcodegen: it writes build/Version.xcconfig
                                     # from Resources/Info.plist first, which is how the
                                     # phone app carries the Mac app's version
XCODE_PROJECT=Ata.xcodeproj
SCHEME=Ata
IPA=Ata.ipa
EXPORT_OPTIONS=ExportOptions.plist   # relative to IOS_DIR
BUNDLE_ID=ai.interactive.ata         # the app itself; the widgets, share and watch ids get
                                     # their own profiles in ExportOptions.plist
SWIFT_TEST_DIR=.                     # the Mac package's tests, the same gate CI runs
TEAM_ID=H874DPF6H5                   # ios/project.yml has no DEVELOPMENT_TEAM, so the
                                     # archive is told which team to sign for
