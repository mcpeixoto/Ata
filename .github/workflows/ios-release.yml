# The TestFlight upload. One shape, every app in this account.
#
# Copied rather than imported: a reusable workflow in another repository would need that
# repository readable by all of these (some are private), and a release pipeline that
# breaks because a *different* repo moved is worse than one file per repo. What keeps them
# the same is that this file holds nothing repo-specific at all — the app's name, scheme
# and paths live in `scripts/ios-release.conf`. So every copy of this file is identical,
# and a diff between two of them is a bug rather than a local adaptation.
#
# Split from the pull-request CI workflow rather than added to it, and not for tidiness.
# A CI workflow filters its push trigger by `paths:`, and GitHub applies a paths filter to
# tag pushes as well as branch pushes — so a release tag cut from a commit that happens not
# to touch the app would match the tag, fail the path test, and never start. A release that
# silently does not run is a failure these repos have already been bitten by. A tags-only
# trigger with no paths filter cannot miss.
#
# What it needs in the repository:
#
#   * An ExportOptions plist: method app-store-connect, the "Apple Distribution"
#     certificate, and the App Store profile for every bundle id in the app.
#   * XcodeGen's project.yml (or the repo's own generate script), so CI builds the same
#     project a Mac does.
#   * scripts/distribute-build.py, which assigns the finished build to the internal
#     TestFlight group. Uploading is not distributing: a build with no group is VALID,
#     READY_FOR_BETA_TESTING and invisible to every tester, forever.
#
# What it needs in repository secrets — five, the same five in every repo:
#
#   APPLE_API_KEY_PATH     the App Store Connect .p8 private key, as text
#   APPLE_API_KEY_ID       its key id
#   APPLE_API_ISSUER       the issuer id
#   IOS_DIST_P12           the Apple Distribution identity, base64 of a .p12
#   IOS_DIST_P12_PASSWORD  the passphrase that .p12 was exported with
#
# `scripts/ios-release-secrets.sh` reports which are missing and sets the three it can find
# on the maintainer's Mac. The .p12 is deliberately not automated: exporting it needs the
# login keychain password, which belongs to a person at a keyboard.
#
# The API key and the distribution identity are separate requirements, and the second is
# the one that is easy to believe you already have. -allowProvisioningUpdates fetches the
# *certificate* from App Store Connect; a certificate without its private key signs
# nothing, and the private key exists only in the keychain whose CSR created it. No API
# role substitutes for it.
#
# This job does not degrade gracefully when a secret is missing. An unsigned build is
# sometimes still useful; an upload never is. A release that reports success having
# uploaded nothing is worse than a red X, so the first step fails loudly.
name: iOS release

on:
  push:
    tags: ['v*']
  # So a failed upload can be retried against the same tag without cutting another one.
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion to upload. Defaults to this run''s number. TestFlight refuses a build number it has already seen, so a retry after a partial upload needs a new one.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    # macos-26 for Xcode 26: these packages compile under the Swift 6 language mode, which
    # the older images do not offer.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # Which app this is, and where its project lives. Everything repo-specific is in that
      # one file, which is why this workflow is byte-identical in every repo — a diff
      # between two copies of it is a bug, not a local adaptation. scripts/release-ios.sh
      # reads the same file, so the Mac route and the CI route cannot disagree about which
      # scheme to build or which .ipa to upload.
      - name: Read the pipeline config
        run: |
          set -euo pipefail
          conf=scripts/ios-release.conf
          [ -f "$conf" ] || {
            echo "::error::$conf is missing. It is the per-repo half of the pipeline; copy scripts/ios-release.conf.example and fill it in."
            exit 1
          }
          set -a
          # shellcheck disable=SC1090
          . "$conf"
          set +a
          # Every name written out by hand, twice over, rather than looped with indirect
          # expansion: macOS runners ship bash 3.2, where ${!name} is unreliable, and
          # $GITHUB_ENV is not shell, so a quoted value would arrive with its quotes.
          for pair in "IOS_DIR=${IOS_DIR:-}" "GENERATE=${GENERATE:-}" \
                      "XCODE_PROJECT=${XCODE_PROJECT:-}" "SCHEME=${SCHEME:-}" \
                      "IPA=${IPA:-}" "EXPORT_OPTIONS=${EXPORT_OPTIONS:-}" \
                      "BUNDLE_ID=${BUNDLE_ID:-}"; do
            case "$pair" in
              *=)
                echo "::error::${pair%=} is empty in $conf. The archive would guess, and a release that builds the wrong scheme is worse than one that does not build."
                exit 1
                ;;
            esac
          done
          # One redirect per line, which shellcheck would rather see grouped: the
          # repo lint that proves a step was given the variables it reads matches
          # `echo NAME=... >> $GITHUB_ENV` line by line, and a grouped block hides
          # every name from it.
          # shellcheck disable=SC2129
          echo "IOS_DIR=$IOS_DIR" >> "$GITHUB_ENV"
          echo "GENERATE=$GENERATE" >> "$GITHUB_ENV"
          echo "XCODE_PROJECT=$XCODE_PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "SWIFT_TEST_DIR=${SWIFT_TEST_DIR:-}" >> "$GITHUB_ENV"
          echo "TEAM_ID=${TEAM_ID:-}" >> "$GITHUB_ENV"
          echo "$SCHEME in $IOS_DIR, bundle $BUNDLE_ID"

      - name: Check the signing credentials are present
        env:
          KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEY" ]    || missing+=(APPLE_API_KEY_PATH)
          [ -n "$KEY_ID" ] || missing+=(APPLE_API_KEY_ID)
          [ -n "$ISSUER" ] || missing+=(APPLE_API_ISSUER)
          [ -n "$P12" ]    || missing+=(IOS_DIST_P12)
          [ -n "$P12_PW" ] || missing+=(IOS_DIST_P12_PASSWORD)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing App Store Connect secrets: ${missing[*]}. Nothing can be uploaded; failing rather than reporting a release that did not happen. Run scripts/ios-release-secrets.sh --set on the Mac that holds the key."
            exit 1
          fi

      # xcodebuild and altool both look for the key in this directory, under this filename.
      # The secret may hold PEM text or base64 of it depending on how it was pasted, so both
      # are accepted — and anything else fails here, where the message can say so, rather
      # than inside xcodebuild as an opaque authentication error.
      - name: Materialise the App Store Connect key
        env:
          KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          out="$dir/AuthKey_${KEY_ID}.p8"
          if printf '%s' "$KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$KEY" > "$out"
          else
            printf '%s' "$KEY" | base64 --decode > "$out" 2>/dev/null || {
              echo "::error::APPLE_API_KEY_PATH is neither PEM text nor base64. It must be the contents of the .p8 key, not a path."
              exit 1
            }
          fi
          grep -q 'BEGIN PRIVATE KEY' "$out" || {
            echo "::error::The decoded App Store Connect key is not a private key."
            exit 1
          }
          chmod 600 "$out"
          echo "ASC_KEY_PATH=$out" >> "$GITHUB_ENV"

      # The distribution identity, into a keychain of this run's own.
      #
      # Not the login keychain: a runner is shared infrastructure and a signing key left in
      # a default keychain outlives the job that needed it. This one is created here, given
      # a random password, and dies with the runner.
      #
      # set-key-partition-list is the step whose absence produces the strangest failure:
      # without it codesign finds the key, macOS asks permission to use it, nobody answers,
      # and the build hangs until the job times out.
      - name: Import the distribution identity
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          pw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')

          security create-keychain -p "$pw" "$keychain"
          # The default is a five-minute lock timeout, shorter than an archive.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12" 2>/dev/null || {
            echo "::error::IOS_DIST_P12 is not base64. Export with: base64 -i dist.p12 | gh secret set IOS_DIST_P12"
            exit 1
          }
          if ! security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PW" \
                 -T /usr/bin/codesign -T /usr/bin/security 2>"$RUNNER_TEMP/import.err"; then
            # Overwhelmingly a passphrase mismatch: the .p12 was exported with one -P value
            # and IOS_DIST_P12_PASSWORD holds another. `security` calls it
            # "MAC verification failed", which names the symptom and not the cause.
            if grep -qi 'MAC verification\|password' "$RUNNER_TEMP/import.err"; then
              echo "::error::Could not decrypt IOS_DIST_P12. IOS_DIST_P12_PASSWORD does not match the passphrase the .p12 was exported with. Re-export and set both together."
            else
              echo "::error::Could not import IOS_DIST_P12:"
              cat "$RUNNER_TEMP/import.err"
            fi
            exit 1
          fi
          rm -f "$RUNNER_TEMP/dist.p12"

          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$keychain" >/dev/null
          # The search list, so xcodebuild looks here at all. Keeping login.keychain-db in
          # it leaves the runner's own tooling working.
          security list-keychain -d user -s "$keychain" login.keychain-db

          found=$(security find-identity -v -p codesigning "$keychain" | grep -c 'Apple Distribution' || true)
          if [ "$found" -eq 0 ]; then
            echo "::error::No 'Apple Distribution' identity in the imported .p12. Export the identity — certificate *and* private key — not just the certificate."
            security find-identity -v -p codesigning "$keychain" || true
            exit 1
          fi
          echo "imported $found Apple Distribution identity(ies)"

          # An Apple distribution certificate lasts a year. When it lapses the archive fails
          # exactly as it does with no certificate at all — ten minutes in, complaining about
          # a missing signing certificate — and the cause is a date. Saying so on every
          # release means the renewal is scheduled rather than discovered.
          end=$(security find-certificate -c 'Apple Distribution' -p "$keychain" \
                | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
          if [ -n "$end" ]; then
            left=$(( ( $(date -j -f '%b %e %T %Y %Z' "$end" +%s 2>/dev/null || echo 0) - $(date +%s) ) / 86400 ))
            echo "certificate expires $end ($left days)"
            if [ "$left" -lt 0 ]; then
              echo "::error::The distribution certificate expired on $end. Renew it, then re-export IOS_DIST_P12."
              exit 1
            elif [ "$left" -lt 45 ]; then
              echo "::warning::The distribution certificate expires in $left days ($end). Renew it and re-export IOS_DIST_P12 before it lapses — once it does, every release in every repo fails at the archive."
            fi
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # The version, before the project is generated, because both keys are project
      # settings that the generate step bakes into Info.plist.
      #
      # The build number is github.run_number, which is monotonic per workflow and never
      # repeats, so a retry against the same tag gets a fresh one for free. The explicit
      # input still wins, for when TestFlight has already seen a run number because an
      # upload half-succeeded.
      - name: Stamp the version from the tag
        id: version
        env:
          OVERRIDE: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          build="${OVERRIDE:-$RUN_NUMBER}"
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            marketing="${GITHUB_REF_NAME#v}"
          else
            # A manual run has no tag to read. Keep whatever the tree says and only move the
            # build number, so a dispatch can retry an upload without inventing a version.
            marketing=""
          fi
          if [ -n "$marketing" ]; then
            bash scripts/stamp-ios-version.sh "$marketing" "$build" "$IOS_DIR"
          else
            marketing=$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]*)"?.*/\1/p' "$IOS_DIR/project.yml" 2>/dev/null | head -1)
            [ -n "$marketing" ] || marketing=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist 2>/dev/null || true)
            bash scripts/stamp-ios-version.sh "$marketing" "$build" "$IOS_DIR"
          fi
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Generate the Xcode project
        working-directory: ${{ env.IOS_DIR }}
        run: ${{ env.GENERATE }}

      # The package tests run here too. The PR workflow already ran them, but a tag can be
      # cut from any commit, and shipping a build whose core suite was never run against
      # this exact tree is how a release becomes the first place a regression is seen.
      - name: Test the core package
        if: env.SWIFT_TEST_DIR != ''
        working-directory: ${{ env.SWIFT_TEST_DIR }}
        run: swift test

      # -allowProvisioningUpdates with the API key is what lets a headless runner obtain the
      # App Store profiles. Without it, signing on a fresh runner has nothing to sign with.
      - name: Archive
        working-directory: ${{ env.IOS_DIR }}
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$SCHEME.xcarchive" \
            ${TEAM_ID:+DEVELOPMENT_TEAM=$TEAM_ID} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: Export the .ipa
        working-directory: ${{ env.IOS_DIR }}
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/$SCHEME.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      # --validate-app first: it catches a bad Info.plist, a missing icon or an entitlement
      # mismatch in seconds, where the same faults surface from the upload as an email some
      # minutes later and leave the build number spent.
      - name: Validate
        working-directory: ${{ env.IOS_DIR }}
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --validate-app -f "build/export/$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Upload to TestFlight
        working-directory: ${{ env.IOS_DIR }}
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app -f "build/export/$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      # Upload is not distribution.
      #
      # altool returns once App Store Connect holds the binary, and a build with no beta
      # group is VALID, READY_FOR_BETA_TESTING and invisible in the TestFlight app to
      # everybody. Polaris uploaded five builds into exactly that state over six weeks, every
      # job green, because "uploaded" was the only thing anyone checked.
      - name: Distribute to the internal testers
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_VERSION: ${{ steps.version.outputs.marketing }}
          # Which build this run made. Without it the script cannot tell its own upload from
          # the previous release's, and Polaris once distributed the wrong one.
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyjwt cryptography \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyjwt cryptography
          python3 scripts/distribute-build.py

      # The archive carries the dSYMs. Keeping it is what makes a crash report from a tester
      # symbolicable weeks later, once the runner is long gone.
      - name: Keep the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ${{ env.IOS_DIR }}/build/${{ env.SCHEME }}.xcarchive
          if-no-files-found: ignore
