name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Package.swift uses tools 6.2 (for package traits), which needs Xcode 26.
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "$XCODE"
          swift --version

      - name: Build (release)
        run: swift build -c release --arch arm64 --disable-keychain

      - name: Unit tests
        run: swift test --disable-keychain

      - name: Check localizations are in sync
        run: ./scripts/check-localization.sh

      - name: Assemble Ata.app
        run: ./scripts/build-app.sh

      - name: Verify the bundle
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Ata.app/Contents/Info.plist
          test -d build/Ata.app/Contents/Resources/en.lproj
          test -d build/Ata.app/Contents/Resources/pt.lproj
          test -f build/Ata.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict build/Ata.app
          # FoundationModels exists only on macOS 26. Linked strongly, Ata would not
          # launch at all on 14 or 15, so it must be weak (or not linked).
          link=$(otool -l build/Ata.app/Contents/MacOS/Ata | awk '/^ *cmd /{c=$2} /name .*FoundationModels/{print c}')
          echo "FoundationModels: ${link:-not linked}"
          if [ -n "$(echo "$link" | grep -vx LC_LOAD_WEAK_DYLIB)" ]; then
            echo "::error::FoundationModels is linked with $link; it must be LC_LOAD_WEAK_DYLIB"
            exit 1
          fi

  snapshots:
    name: Screenshots
    runs-on: macos-15
    # A bonus for reviewers, not a gate: a runner without a usable GUI session
    # should not block a merge.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Render the UI
        run: ./scripts/snapshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/images/*.png
          retention-days: 14
