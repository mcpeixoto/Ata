name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    name: Metrics worker
    # Public repo: GitHub-hosted, never self-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: metrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: metrics/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: Build and check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Package.swift uses tools 6.2 (for package traits), which needs Xcode 26.
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "$XCODE"
          swift --version

      - name: Build (release)
        run: swift build -c release --arch arm64 --disable-keychain

      - name: Unit tests
        run: swift test --disable-keychain

      - name: Check localizations are in sync
        run: ./scripts/check-localization.sh

      - name: Cache the bundled whisper-cli
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Ata-build
          key: whisper-${{ hashFiles('scripts/build-whisper.sh') }}

      - name: Assemble Ata.app
        run: ./scripts/build-app.sh

      - name: MCP server lists its tools
        run: |
          meetings=$(mktemp -d)
          support=$(mktemp -d)
          output=$(ATA_MEETINGS_DIR="$meetings" ATA_SUPPORT_DIR="$support" build/Ata.app/Contents/MacOS/Ata --mcp <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          EOF
          )
          echo "$output"
          echo "$output" | grep -q list_meetings
          echo "$output" | grep -q list_people
          rm -rf "$meetings" "$support"

      - name: Verify the bundle
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Ata.app/Contents/Info.plist
          test -d build/Ata.app/Contents/Resources/en.lproj
          test -d build/Ata.app/Contents/Resources/pt.lproj
          test -f build/Ata.app/Contents/Resources/AppIcon.icns
          test -f build/Ata.app/Contents/Resources/NOTICE
          codesign --verify --deep --strict build/Ata.app
          build/Ata.app/Contents/MacOS/whisper-cli --help >/dev/null
          ! otool -L build/Ata.app/Contents/MacOS/whisper-cli | grep -E 'homebrew|/usr/local'
          # FoundationModels exists only on macOS 26. Linked strongly, Ata would not
          # launch at all on 14 or 15, so it must be weak (or not linked).
          link=$(otool -l build/Ata.app/Contents/MacOS/Ata | awk '/^ *cmd /{c=$2} /name .*FoundationModels/{print c}')
          echo "FoundationModels: ${link:-not linked}"
          if [ -n "$(echo "$link" | grep -vx LC_LOAD_WEAK_DYLIB)" ]; then
            echo "::error::FoundationModels is linked with $link; it must be LC_LOAD_WEAK_DYLIB"
            exit 1
          fi

  snapshots:
    name: Screenshots
    runs-on: macos-15
    # A bonus for reviewers, not a gate: a runner without a usable GUI session
    # should not block a merge.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Render the UI
        run: ./scripts/snapshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/images/*.png
          retention-days: 14

  ios:
    name: iPhone app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The iPhone app targets iOS 26, which needs Xcode 26.
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The iPhone pins FluidAudio in its own package (Xcode projects can't set
      # package traits); it must stay the Mac's version.
      - name: FluidAudio is the same version on Mac and iPhone
        run: |
          mac=$(grep -o 'FluidAudio.git", exact: "[^"]*"' Package.swift)
          phone=$(grep -o 'FluidAudio.git", exact: "[^"]*"' ios/Packages/AtaDependencies/Package.swift)
          echo "Mac:    $mac"
          echo "iPhone: $phone"
          if [ -z "$mac" ] || [ "$mac" != "$phone" ]; then
            echo "::error::FluidAudio is pinned differently in Package.swift and ios/Packages/AtaDependencies/Package.swift"
            exit 1
          fi

      - name: Generate the Xcode project
        run: ./ios/generate.sh

      # The newest iOS 26 iPhone simulator on the runner, preferring an iPhone 17.
      - name: Pick a simulator
        id: sim
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -I -c '
          import json, re, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m or int(m.group(1)) < 26:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in devices:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      key = (version, d["name"].startswith("iPhone 17"), d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"], runtime)
          if best:
              print(best[1])
              print(best[2], best[3], file=sys.stderr)
          '
          }
          UDID=$(pick)
          if [ -z "$UDID" ]; then
            echo "No iOS 26 iPhone simulator installed; downloading the iOS platform."
            xcodebuild -downloadPlatform iOS
            UDID=$(pick)
          fi
          [ -n "$UDID" ] || { echo "::error::No iOS 26 iPhone simulator available"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project ios/Ata.xcodeproj -scheme Ata \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build test

      # Every screen in light and dark, with fixture meetings: download the
      # "iphone-screenshots" artifact from the run's summary page. A gate since
      # 3.5.2, whose meeting screen froze on opening while this step failed
      # quietly: these UI tests are the only ones that open the real screens.
      - name: Take iPhone screenshots
        timeout-minutes: 20
        run: ./ios/snapshots.sh "${{ steps.sim.outputs.udid }}"

      - name: Upload iPhone screenshots
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: iphone-screenshots
          path: ios/build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Verify the app
        run: |
          APP=ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Ata.app
          mac=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          phone=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "Mac $mac, iPhone $phone"
          [ "$mac" = "$phone" ] || { echo "::error::The iPhone app is $phone, the Mac $mac"; exit 1; }
          test -d "$APP/PlugIns/AtaWidgets.appex"
          test -d "$APP/PlugIns/AtaShare.appex"
          test -f "$APP/PlugIns/AtaShare.appex/pt.lproj/InfoPlist.strings"
          test -f "$APP/en.lproj/Localizable.strings"
          test -f "$APP/pt.lproj/Localizable.strings"
          test -f "$APP/pt.lproj/InfoPlist.strings"
