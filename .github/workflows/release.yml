name: Release

# Tagging `vX.Y.Z` builds, signs, notarizes and publishes the app. The in-app
# updater reads the resulting GitHub release, so a tag is all it takes to ship
# an update to everyone running Ata.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v2.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches Info.plist
        run: |
          PLIST=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "$PLIST" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${{ steps.version.outputs.tag }} does not match CFBundleShortVersionString ($PLIST)." >&2
            echo "Bump Resources/Info.plist before tagging." >&2
            exit 1
          fi

      # Releases are normally published from the maintainer's Mac with
      # ./scripts/release-local.sh, which signs with the key in place and needs
      # no exported certificate. This job only takes over once the five signing
      # secrets exist; until then it says so and stops, without failing the tag.
      - name: Check for signing secrets
        id: secrets
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
          HAS_KEY: ${{ secrets.AC_API_KEY != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets, so CI does not publish this release. Run ./scripts/release-local.sh ${{ steps.version.outputs.tag }} on the maintainer's Mac."
          fi

      - name: Import the signing certificate
        if: steps.secrets.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in the certificate." >&2; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and sign
        if: steps.secrets.outputs.enabled == 'true'
        run: ./scripts/build-app.sh --sign "$SIGN_IDENTITY"

      - name: Notarize and staple
        if: steps.secrets.outputs.enabled == 'true'
        env:
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          echo "$AC_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent build/Ata.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout 30m
          rm "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple build/Ata.app
          # Gatekeeper's own verdict, the same check the in-app updater runs.
          spctl -a -vv -t install build/Ata.app

      - name: Package
        if: steps.secrets.outputs.enabled == 'true'
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          # The zip is what the in-app updater downloads.
          ditto -c -k --keepParent build/Ata.app "dist/Ata-$VERSION.zip"
          # The dmg is what people download by hand.
          STAGE=$(mktemp -d)
          cp -R build/Ata.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Ata $VERSION" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/Ata-$VERSION.dmg"
          rm -rf "$STAGE"
          shasum -a 256 dist/* | tee dist/SHA256SUMS.txt

      - name: Publish the release
        if: steps.secrets.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(mktemp)
          {
            echo "Ata $VERSION for macOS 14+ on Apple Silicon."
            echo
            echo "**Install:** download \`Ata-$VERSION.dmg\`, drag Ata to Applications, open it."
            echo "Signed with a Developer ID and notarized by Apple, so it opens without warnings."
            echo
            echo "Already running Ata? It updates itself — or use Settings → Updates → Check now."
            echo
            if [ -f CHANGELOG.md ]; then
              echo "### Changes"
              echo
              awk '/^## /{ if (seen) exit; seen=1; next } seen' CHANGELOG.md
            fi
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/* --title "Ata $VERSION" --notes-file "$NOTES"
          fi
