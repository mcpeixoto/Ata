name: Idea
description: Suggest something Ata should do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Ata to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you trying to get done
      description: The meeting workflow behind the request, so the feature fits it.
